[project]
name = "dcfbench"
version = "0.0.1"
description = "Answer-key engine of the staged DCF benchmark (point-in-time U.S. inputs, policies, deterministic DCF)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dcfbench = "dcfbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcfbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
